name: build-jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: List output
        if: always()
        run: ls -la build/libs || true
      - uses: actions/upload-artifact@v4
        with:
          name: custommusic-jar
          path: |
            build/libs/custommusic-*.jar
            !build/libs/*-dev.jar
            !build/libs/*-uberdev.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error
